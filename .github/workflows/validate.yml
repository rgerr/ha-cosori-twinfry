name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    # Home Assistant 2026.10 pins pyvesync 3.4.2, which has no TwinFry support;
    # this integration needs 3.5.0. Hassfest reports that conflict until Home
    # Assistant ships pyvesync 3.5.0 (already on its dev branch). Remove this
    # line once the check passes on its own.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand assets and topics only matter for the HACS default list.
          ignore: brands topics
