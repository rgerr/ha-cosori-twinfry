name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements_test.txt ruff
      - name: Ruff
        run: ruff check custom_components tests scripts && ruff format --check custom_components tests scripts
      - name: Pytest
        run: pytest --cov=custom_components/cosori_twinfry --cov-report=term-missing
